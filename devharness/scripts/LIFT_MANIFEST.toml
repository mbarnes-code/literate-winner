# LIFT_MANIFEST.toml — canonical, machine-readable provenance for every file
# in devharness that was ported or adapted from an upstream open-source project.
#
# This file is the single source of truth. `scripts/generate_notice.py` reads
# it to regenerate `NOTICE` and the ported-file tables in
# `THIRD_PARTY_LICENSES.md`. CI should verify that:
#   (a) every ported file's docstring header cites the upstream shown here, and
#   (b) `NOTICE` + `THIRD_PARTY_LICENSES.md` agree with this manifest.
#
# Spec reference: docs/devharness-spec.md §14.3

